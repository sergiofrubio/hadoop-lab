[desktop]
http_host=0.0.0.0
http_port=8888
time_zone=Europe/Madrid
# Solo para uso local de aprendizaje
secret_key=hadoop-lab-secret-key-change-me
app_blacklist=search,security,oozie,jobsub,pig,sqoop,hbase,zookeeper,spark,impala

  [[database]]
  engine=sqlite3
  name=/usr/share/hue/desktop/hue-db/hue.db

[hadoop]
  [[hdfs_clusters]]
    [[[default]]]
    fs_defaultfs=hdfs://namenode:8020
    webhdfs_url=http://namenode:9870/webhdfs/v1

  [[yarn_clusters]]
    [[[default]]]
    resourcemanager_host=resourcemanager
    resourcemanager_port=8032
    submit_to=True
    resourcemanager_api_url=http://resourcemanager:8088
    proxy_api_url=http://resourcemanager:8088

[beeswax]
hive_server_host=hive-server
hive_server_port=10000
hive_conf_dir=/etc/hive/conf

[notebook]
show_notebooks=true
  [[interpreters]]
    [[[hive]]]
    name=Hive
    interface=hiveserver2

[filebrowser]
show_download_button=true
show_upload_button=true
